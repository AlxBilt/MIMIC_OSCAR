[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
lib_deps = 
	git+https://github.com/tonton81/FlexCAN_T4.git
	adafruit/Adafruit BMP3XX Library@^2.1.6
	adafruit/Adafruit MAX31856 library@^1.2.8
	adafruit/Adafruit MCP4728@^1.0.10
	adafruit/Adafruit ADG72x@^1.0.0
